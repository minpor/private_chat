server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: private-chat
  flyway:
    enabled: false
  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:private_chat}
    username: ${DB_USER:private_chat}
    password: ${DB_PASSWORD:your_password}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

app:
  nats:
    url: ${NATS_URL:nats://localhost:4222}
  draft:
    ttl-minutes: ${DRAFT_TTL_MINUTES:30}
    patch-rate-limit-per-second: ${DRAFT_PATCH_RATE_LIMIT:20}
    commit-rate-limit-per-minute: ${DRAFT_COMMIT_RATE_LIMIT:30}
    message-rate-limit-per-minute: ${MESSAGE_RATE_LIMIT:30}
  outbox:
    poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:500}
    batch-size: ${OUTBOX_BATCH_SIZE:100}
  jwt:
    secret: ${JWT_SECRET:change-me-to-random-256-bit-string-min-32-chars}
    access-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:15}
    refresh-ttl-days: ${JWT_REFRESH_TTL_DAYS:7}

logging:
  level:
    chat.privatechat: INFO
    org.springframework.r2dbc: WARN
