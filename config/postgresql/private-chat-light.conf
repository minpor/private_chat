# Lightweight PostgreSQL profile for private-chat (dev / single-node).
# Tested target: ~2k TPS on POST /messages with chat member cache in Redis.
#
# Apply (Debian/Ubuntu, PG 16):
#   sudo cp config/postgresql/private-chat-light.conf /etc/postgresql/16/main/conf.d/
#   sudo systemctl reload postgresql
#
# Rollback: remove the file from conf.d and reload again.

max_connections = 150

# Hot dataset is ~2–3 GB (messages + outbox); 1 GB shared_buffers is enough here.
shared_buffers = 1GB

# Simple INSERT/EXISTS queries; no large sorts or hash aggregates on the write path.
work_mem = 4MB
maintenance_work_mem = 128MB

# Planner hint only (does not allocate RAM).
effective_cache_size = 8GB

# Write burst: message + outbox per request; 1 GB WAL is sufficient at 2k TPS.
max_wal_size = 1GB
wal_buffers = 64MB
checkpoint_completion_target = 0.9

# SSD / NVMe
random_page_cost = 1.1
effective_io_concurrency = 200
